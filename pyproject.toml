[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witchesbrew"
version = "0.1.0"
description = "Research reproduction of 'Witches' Brew: Industrial Scale Data Poisoning via Gradient Matching' (Geiping et al., ICLR 2021)"
# 3.9 works: every module defers its annotations with `from __future__ import annotations`, and no
# builtin generic or PEP 604 union is evaluated at runtime. 3.10+ is still preferred.
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
